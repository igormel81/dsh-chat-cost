name: publish

# Token-free releases through npm trusted publishing (OIDC): the runner asks
# GitHub for a short-lived identity token, npm exchanges it for the right to
# publish this package, and the published tarball carries a provenance
# attestation. No long-lived npm token is stored anywhere.
#
# One-time setup on npmjs.com — package page -> Settings -> Trusted Publisher ->
# GitHub Actions, with:
#   Organization or user: igormel81
#   Repository:           dsh-chat-cost
#   Workflow filename:    publish.yml
#   Environment:          (leave empty; this workflow declares none)
# Until that is configured the publish step fails with 403, which is why the
# workflow is dispatched by hand and defaults to a dry run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package and test without publishing
        type: boolean
        default: true
      dist_tag:
        description: dist-tag to publish under
        type: string
        default: latest
      mode:
        description: direct publishes now; stage submits for a 2FA approval on npmjs.com
        type: choice
        options:
          - direct
          - stage
        default: direct
      deprecate:
        description: Version range to deprecate after this run (e.g. 0.5.0); empty to skip
        type: string
        default: ''

permissions:
  contents: read
  id-token: write # trusted publishing and provenance both need this

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one in the runner image lags.
      - name: Use the current npm
        run: npm install --global npm@latest

      - name: The version in package.json is the version the plugin stamps into cost logs
        run: |
          pkg=$(node -p "require('./package.json').version")
          stamped=$(sed -n "s/^const PLUGIN_VERSION = '\(.*\)'$/\1/p" lib/index.js)
          echo "package.json $pkg, PLUGIN_VERSION $stamped"
          test "$pkg" = "$stamped"

      - name: Refuse to publish a version that is already on the registry
        if: inputs.dry_run == false
        run: |
          pkg=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$pkg@$version" version >/dev/null 2>&1; then
            echo "::error::$pkg@$version is already published; bump the version first"
            exit 1
          fi

      - name: Test
        run: node --test test/*.test.mjs

      # `npm pack` proves the tarball contents and the version stamp without
      # touching the registry: `npm publish --dry-run` still refuses a version
      # that is already published, which is exactly what a dry run tends to be
      # asked for. Everything except the registry write is exercised here.
      - name: Package without publishing
        if: inputs.dry_run
        run: npm pack --dry-run

      # npm matches its trusted-publisher configuration against exactly these
      # strings. When publishing is rejected, this is what to compare with the
      # form on npmjs.com, character by character.
      - name: The identity npm matches against your trusted publisher
        run: |
          echo "repository:    $GITHUB_REPOSITORY"
          echo "workflow ref:  $GITHUB_WORKFLOW_REF"
          echo "workflow file: $GITHUB_WORKFLOW"
          echo "ref:           $GITHUB_REF"
          echo "event:         $GITHUB_EVENT_NAME"
          echo "environment:   this job declares none"
          echo "npm:           $(npm --version), node $(node --version)"

      - name: Publish
        if: inputs.dry_run == false && inputs.mode == 'direct'
        run: npm publish --access public --provenance --tag "${{ inputs.dist_tag }}"

      # Staged publishing needs npm >= 11.15 and 2FA on the account; the version
      # only reaches the registry once a maintainer approves it on npmjs.com.
      - name: Stage for approval
        if: inputs.dry_run == false && inputs.mode == 'stage'
        run: npm stage publish --tag "${{ inputs.dist_tag }}"

      # A bad release should not stay installable by accident. Deprecation is a
      # packument write rather than a publish, so it may need a token even where
      # trusted publishing is configured; a failure here is reported, not fatal
      # to the release that already went out.
      - name: Deprecate an earlier version
        if: inputs.deprecate != ''
        continue-on-error: true
        run: |
          npm deprecate "dsh-chat-cost@${{ inputs.deprecate }}" \
            "fails to load at host boot; upgrade to 0.5.1 or later"
